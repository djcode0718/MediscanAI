name: MediScanAI
options:
  bundleIdPrefix: ai.mediscan
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.4"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"

targets:
  MediScanAI:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MediScanAI
    settings:
      base:
        PRODUCT_NAME: MediScanAI
        PRODUCT_BUNDLE_IDENTIFIER: ai.mediscan.ios
        INFOPLIST_FILE: MediScanAI/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: "YES"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        CODE_SIGNING_ALLOWED: "NO"

  MediScanAITests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MediScanAITests
    dependencies:
      - target: MediScanAI
    settings:
      base:
        PRODUCT_NAME: MediScanAITests
        PRODUCT_BUNDLE_IDENTIFIER: ai.mediscan.ios.tests
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGNING_ALLOWED: "NO"

  MediScanAIUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MediScanAIUITests
    dependencies:
      - target: MediScanAI
    settings:
      base:
        PRODUCT_NAME: MediScanAIUITests
        PRODUCT_BUNDLE_IDENTIFIER: ai.mediscan.ios.uitests
        TEST_TARGET_NAME: MediScanAI
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGNING_ALLOWED: "NO"

