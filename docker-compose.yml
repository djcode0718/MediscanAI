services:
  postgres:
    image: postgres:15-alpine
    container_name: mediscanai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mediscanai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mediscanai"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.26.0-community
    container_name: mediscanai-neo4j
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH:-${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-neo4jpassword}}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mediscanai-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started
        required: false
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql+psycopg2://postgres:postgrespassword@postgres:5432/mediscanai
      - JWT_SECRET_KEY=docker-local-development-secret-key-mediscanai-2026
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - NEO4J_ENABLED=${NEO4J_ENABLED:-false}
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-}
    ports:
      - "8000:8000"

volumes:
  pgdata:
  neo4jdata:
