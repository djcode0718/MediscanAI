services:
  postgres:
    image: postgres:15-alpine
    container_name: mediscanai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mediscanai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mediscanai"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mediscanai-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql+psycopg2://postgres:postgrespassword@postgres:5432/mediscanai
      - JWT_SECRET_KEY=docker-local-development-secret-key-mediscanai-2026
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    ports:
      - "8000:8000"

volumes:
  pgdata:
