name: MediScanAI PR CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ['feat/**', 'feature/**']

concurrency:
  group: pr-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------------------
  # 1. Fast Backend Checks & Unit Tests (~2 min)
  # ----------------------------------------------------------------------------
  backend-checks:
    name: Backend Fast CI
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'deployment/requirements.txt'

      - name: Python syntax & bytecode compilation check
        run: |
          python -m compileall backend app tests

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Install CPU torch and core runtime requirements
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch==2.1.2+cpu || pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r deployment/requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run fast backend unit tests (mocked boundaries)
        env:
          APP_ENV: test
          DATABASE_URL: "sqlite:///:memory:"
          JWT_SECRET_KEY: ci-cd-mock-jwt-secret-key-for-testing-only-32-chars
          LLM_MODE: online
          FAST_MODE: "1"
        run: |
          pytest \
            tests/api/test_auth_api.py \
            tests/api/test_health_and_readiness.py \
            tests/database/test_database_sqlite.py \
            tests/unit/test_sanitizer.py \
            tests/unit/test_rate_limiter.py \
            tests/unit/test_prompt_v2.py \
            tests/unit/test_security_and_bounds.py \
            tests/unit/test_settings_hygiene.py \
            tests/unit/test_concurrency_limiter.py \
            tests/unit/test_maintenance_safety.py \
            -v --durations=10

  # ----------------------------------------------------------------------------
  # 2. Frontend Build & Linter Checks (~1 min)
  # ----------------------------------------------------------------------------
  frontend-checks:
    name: Frontend Lint & Build
    runs-on: ubuntu-22.04
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run linter
        working-directory: frontend
        run: npm run lint

      - name: Build production assets
        working-directory: frontend
        run: npm run build

  # ----------------------------------------------------------------------------
  # 3. Native iOS Unit Tests (~3 min)
  # ----------------------------------------------------------------------------
  ios-checks:
    name: iOS Unit Tests
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode with iOS Simulator support
        run: |
          echo "=== Installed Xcodes ==="
          ls -d /Applications/Xcode* || true

          FOUND_XCODE=""
          for xc in /Applications/Xcode*.app; do
            [ -d "$xc" ] || continue
            echo "Checking $xc for iOS runtimes..."
            if DEVELOPER_DIR="$xc/Contents/Developer" xcrun simctl list runtimes 2>/dev/null | grep -iq "iOS"; then
              FOUND_XCODE="$xc"
              echo "Found iOS runtime in: $xc"
              break
            fi
          done

          if [ -n "$FOUND_XCODE" ]; then
            echo "Selecting: $FOUND_XCODE"
            sudo xcode-select -s "$FOUND_XCODE"
          else
            echo "No specific Xcode with iOS runtime found; keeping current default"
          fi

          sw_vers
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Run iOS Unit Tests (Focused Suite)
        run: |
          DEST_ID=$(xcodebuild -showdestinations -scheme MediScanAI -project ios/MediScanAI/MediScanAI.xcodeproj 2>/dev/null | grep "platform:iOS Simulator" | grep -v "placeholder" | grep -E "name:iPhone (16|15)" | head -n 1 | sed -n 's/.*id:\([^, ]*\).*/\1/p')
          if [ -z "$DEST_ID" ]; then
            DEST_ID=$(xcodebuild -showdestinations -scheme MediScanAI -project ios/MediScanAI/MediScanAI.xcodeproj 2>/dev/null | grep "platform:iOS Simulator" | grep -v "placeholder" | head -n 1 | sed -n 's/.*id:\([^, ]*\).*/\1/p')
          fi

          if [ -n "$DEST_ID" ]; then
            DEST="id=${DEST_ID}"
          else
            SIM_NAME=$(xcrun simctl list devices available 2>/dev/null | grep -E "iPhone (16|15)" | head -n 1 | sed -E 's/^[ ]+//; s/ \([A-F0-9-]+\).*//')
            SIM_NAME="${SIM_NAME:-iPhone 16}"
            DEST="platform=iOS Simulator,name=${SIM_NAME}"
          fi

          echo "Targeting destination: ${DEST}"
          xcodebuild test \
            -project ios/MediScanAI/MediScanAI.xcodeproj \
            -scheme MediScanAI \
            -only-testing:MediScanAITests \
            -destination "${DEST}"
